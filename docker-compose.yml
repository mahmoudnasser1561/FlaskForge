services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flaskforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flaskforge}
      POSTGRES_DB: ${POSTGRES_DB:-flaskforge}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flaskforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: app.py
      FLASK_CONFIG: production
      # All values below come from a local .env file (see .env.example).
      # None of the real values live in this file, so it's safe to commit.
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DATABASE_URL: postgresql://${POSTGRES_USER:-flaskforge}:${POSTGRES_PASSWORD:-flaskforge}@db:5432/${POSTGRES_DB:-flaskforge}
      FLASKY_ADMIN: ${FLASKY_ADMIN:-admin@example.com}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.googlemail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
      FLASKY_MAIL_SENDER: ${FLASKY_MAIL_SENDER:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MODERATION_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN:-}
      MODERATION_QUEUE_NAME: ${MODERATION_QUEUE_NAME:-moderation_queue}
      MODERATION_HEARTBEAT_KEY: ${MODERATION_HEARTBEAT_KEY:-moderation_agent:heartbeat}
      CHATBOT_SERVICE_URL: http://chatbot-service:5001
      CHATBOT_SERVICE_TOKEN: ${CHATBOT_SERVICE_TOKEN:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  moderation-agent:
    build: ./moderation_agent
    profiles: ["moderation"]
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MODERATION_API_BASE_URL: http://web:5000
      MODERATION_SERVICE_TOKEN: ${MODERATION_SERVICE_TOKEN:-}
      MODERATION_QUEUE_NAME: ${MODERATION_QUEUE_NAME:-moderation_queue}
      MODERATION_HEARTBEAT_KEY: ${MODERATION_HEARTBEAT_KEY:-moderation_agent:heartbeat}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-amazon.nova-micro-v1:0}
    depends_on:
      redis:
        condition: service_started
      web:
        condition: service_healthy

  chatbot-service:
    build: ./chatbot_service
    profiles: ["chatbot"]
    environment:
      CHATBOT_SERVICE_TOKEN: ${CHATBOT_SERVICE_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CHATBOT_MODEL_ID: ${CHATBOT_MODEL_ID:-amazon.nova-micro-v1:0}
    volumes:
      - ./moderation_agent/policy.md:/app/policy.md:ro

volumes:
  db_data:

{% extends 'base.html' %}
{% import "bootstrap/wtf.html" as wtf %}

{% block title %}StaffRoom - Register{% endblock %}

{% block page_content %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">StaffRoom</div>
        <h1>Create your account</h1>
        {{ wtf.quick_form(form) }}
        <div class="divider"><span>or</span></div>
        <a href="{{ url_for('auth.google_login') }}" class="btn btn-google btn-block">
            <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4c-7.4 0-13.8 4.1-17.1 10.1z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.5C29.6 35.4 27 36 24 36c-5.3 0-9.6-3.1-11.3-7.5l-6.5 5.1C9.9 39.7 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.5l6.5 5.5C41.4 36.4 44 30.9 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
            Sign up with Google
        </a>
        <p class="auth-foot">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}

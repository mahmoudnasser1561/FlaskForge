{% extends 'base.html' %}
{% import "bootstrap/wtf.html" as wtf %}

{% block title %}StaffRoom - Register{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>Register</h1>
</div>
<div class="col-md-4">
    {{ wtf.quick_form(form) }}
    <br>
    <p>
        <a href="{{ url_for('auth.google_login') }}" class="btn btn-default">
            Sign up with Google
        </a>
    </p>
</div>
{% endblock %}

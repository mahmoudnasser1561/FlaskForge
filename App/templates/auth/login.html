{% extends 'base.html' %}
{% import "bootstrap/wtf.html" as wtf %}

{% block title %}StaffRoom - Login{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>Login</h1>
</div>
<div class="col-md-4">
    {{ wtf.quick_form(form) }}
    <br>
    <p>
        <a href="{{ url_for('auth.google_login') }}" class="btn btn-default">
            Sign in with Google
        </a>
    </p>
    <p>
        New user?
        <a href="{{ url_for('auth.register') }}">
            Click here to register
        </a>
    </p>
</div>
{% endblock %}
